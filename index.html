<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JEE Screenshot Cleaner - Final</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
body{font-family:Arial,sans-serif;max-width:850px;margin:20px auto;padding:15px;background:#f4f6fa;color:#172033}
main{background:white;padding:20px;border-radius:14px}
h1{font-size:24px;margin:0 0 8px}button,.upload{background:#175cd3;color:white;border:0;padding:12px 16px;border-radius:8px;cursor:pointer;margin:5px 3px}
button:disabled{opacity:.5}#gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px;margin-top:18px}
.card{border:1px solid #ccd3df;border-radius:10px;padding:8px}
.card img{width:100%;height:140px;object-fit:contain;background:#eee}
.small{font-size:11px;padding:6px}label{display:block;margin:10px 0}.note{color:#555;font-size:13px}
</style>
</head>
<body><main>
<h1>JEE Screenshot Cleaner - Serial 1,2,3</h1>
<p>Upload Q35-Q59 screenshots. PDF will have 1,2,3 serial, no missing Q.</p>
<input id="files" type="file" accept="image/*" multiple>
<label><input id="crop" type="checkbox" checked> Trim white margins</label>
<label><input id="contrast" type="checkbox" checked> High contrast (black text)</label>
<label><input id="serial" type="checkbox" checked> Add 1,2,3 serial numbers on PDF</label>
<label>Layout:
<select id="layout">
<option value="clear">Clear Readable (3 pages for 25Q) - Recommended</option>
<option value="compact">Compact 2-Page (smaller font)</option>
</select>
</label>
<p id="count">No images selected.</p>
<div id="gallery"></div>
<p><button id="make">Create Final PDF (1-25 Serial)</button></p>
<p id="status" class="note"></p>
</main>
<script>
const filesInput=document.getElementById('files'), gallery=document.getElementById('gallery'), count=document.getElementById('count'), status=document.getElementById('status');
let items=[];
filesInput.addEventListener('change',async()=>{
 for(const file of [...filesInput.files].filter(f=>f.type.startsWith('image/'))){
  const url=URL.createObjectURL(file), img=await new Promise((r,j)=>{const im=new Image();im.onload=()=>r(im);im.onerror=j;im.src=url});
  items.push({file,url,img,name:file.name});
 }
 render(); filesInput.value='';
});
function render(){
 gallery.innerHTML=''; count.textContent=items.length+' selected';
 items.forEach((it,i)=>{
  const c=document.createElement('div');c.className='card';
  c.innerHTML=`<img src="${it.url}"><p>${i+1}. ${it.name}</p>`;
  [['↑',()=>{if(i>0)[items[i],items[i-1]]=[items[i-1],items[i]];render()}],['↓',()=>{if(i<items.length-1)[items[i],items[i+1]]=[items[i+1],items[i]];render()}],['X',()=>{URL.revokeObjectURL(it.url);items.splice(i,1);render()}]]
 .forEach(([t,f])=>{const b=document.createElement('button');b.textContent=t;b.className='small';b.onclick=f;c.appendChild(b)});
  gallery.appendChild(c);
 });
}
function processImage(img){
 const c=document.createElement('canvas');c.width=img.naturalWidth;c.height=img.naturalHeight;
 const ctx=c.getContext('2d',{willReadFrequently:true});ctx.drawImage(img,0,0);
 if(document.getElementById('contrast').checked){
  const d=ctx.getImageData(0,0,c.width,c.height);
  for(let i=0;i<d.data.length;i+=4){const v=.299*d.data[i]+.587*d.data[i+1]+.114*d.data[i+2];const z=v>180?255:v<90?0:v; d.data[i]=d.data[i+1]=d.data[i+2]=z}
  ctx.putImageData(d,0,0);
 }
 return c;
}
document.getElementById('make').onclick=async()=>{
 if(!items.length){status.textContent='Upload images first';return}
 const {jsPDF}=window.jspdf, pdf=new jsPDF({unit:'mm',format:'a4'});
 const pw=210,ph=297,margin=10, addSerial=document.getElementById('serial').checked, layout=document.getElementById('layout').value;
 let y=margin, page=0;
 pdf.setFontSize(11); pdf.text('JEE Main PnC - Serial 1 to '+items.length+' - Clear Hardcopy', margin, y); y+=8;
 for(let i=0;i<items.length;i++){
  status.textContent='Processing '+(i+1)+'/'+items.length;
  const canvas=processImage(items[i].img);
  const maxW = pw-2*margin, h = layout==='compact'? 32 : 45;
  const ratio=canvas.width/canvas.height;
  let w = h*ratio; if(w>maxW){w=maxW}
  let finalH = w/ratio;
  if(y+finalH+ (addSerial?8:0) > ph-margin){pdf.addPage(); y=margin; page++}
  if(addSerial){pdf.setFontSize(9); pdf.text((i+1)+'.', margin, y+4); y+=5;}
  pdf.addImage(canvas.toDataURL('image/jpeg',0.92),'JPEG',margin+ (addSerial?6:0),y,w,finalH,undefined,'FAST');
  y+=finalH+6;
  pdf.setDrawColor(200); pdf.line(margin,y,pw-margin,y); y+=5;
 }
 pdf.save('JEE_Final_1-25_Serial.pdf');
 status.textContent='Done! Q47 included, 1,2,3 serial added. Check before print.';
};
</script></body></html>
